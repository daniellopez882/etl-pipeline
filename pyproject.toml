[project]
name = "etl-pipeline"
version = "0.2.0"
description = "Extract online transactions from Redshift, drop duplicates, load a CSV to S3."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` does not add the working directory to sys.path the way
# `python -m pytest` does; without this the conftest cannot import the app.
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv312"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "main"]
