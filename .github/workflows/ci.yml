name: CI

# There was no pipeline and no test; the code could not be imported without
# running the job.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Importing main must not run the pipeline
        # The old main.py connected to Redshift at import. With no
        # configuration at all this must exit 78 (EX_CONFIG) from main(),
        # not fail on a connection attempt.
        run: |
          python -c "import main; print('import ok')"
          set +e
          python main.py
          code=$?
          set -e
          [ "$code" = "78" ] || { echo "::error::expected exit 78 without configuration, got $code"; exit 1; }
          echo "unconfigured run exited 78 as expected"

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bandit
        run: bandit -r src main.py -ll -f screen

      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true  # advisory feed availability, not a code defect

      - name: No credential file may be tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$tracked" ]; then echo "$tracked"; echo "::error::a credential file is committed"; exit 1; fi
          echo "clean"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t etl-pipeline:ci .

      - name: The image must not run as root
        run: |
          uid=$(docker run --rm --entrypoint id etl-pipeline:ci -u)
          [ "$uid" != "0" ] || { echo "::error::container runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: An unconfigured container exits 78, not with a traceback
        run: |
          set +e
          docker run --rm etl-pipeline:ci
          code=$?
          set -e
          [ "$code" = "78" ] || { echo "::error::expected 78, got $code"; exit 1; }
          docker run --rm etl-pipeline:ci --help
